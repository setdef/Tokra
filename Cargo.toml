# This Cargo.toml is here to let externals tools (IDEs, etc.) know that this is
# a Rust project. Your extensions dependencies should be added to the Cargo.toml
# in the ext/ directory.

[workspace]
members = ["./ext/tokra", "./plugins/clipboard/ext/tokra_clipboard"]
resolver = "2"

# Lints live in each member crate (see ext/tokra/Cargo.toml), so a crate
# packaged alone in its gem still compiles with them.
