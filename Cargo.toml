# The tokra gem's Cargo workspace. It ships in the gem beside Cargo.lock, so
# an installed gem compiles against exactly the dependency versions this
# repository tests. Each plugin gem with a native crate is its own workspace
# (plugins/*/Cargo.toml) with its own Cargo.lock, for the same reason.

[workspace]
members = ["ext/tokra"]
exclude = ["plugins"]
resolver = "2"

# Lints live in each member crate (see ext/tokra/Cargo.toml), so a crate
# never depends on a workspace table for them.
