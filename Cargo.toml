# The tokra gem's Cargo workspace. It ships in the gem beside Cargo.lock, so
# an installed gem compiles against exactly the dependency versions this
# repository tests. Each plugin gem with a native crate is its own workspace
# (plugins/*/Cargo.toml) with its own Cargo.lock, for the same reason.

[workspace]
members = ["ext/tokra"]
exclude = ["plugins", "vendor"]
resolver = "2"

# magnus 0.9.3 as crates.io serves it, with the change
# doc/contributors/upstream/magnus-rb-len-t.patch makes, so that it passes
# Ruby 4.1's lengths and indices as rb_len_t, 64 bits on RubyInstaller's
# Ruby, where long is 32 (Plan 071). It goes when a magnus release has the
# change. The gem ships the folder, so an installed gem builds the same.
[patch.crates-io]
magnus = { path = "vendor/magnus" }

# Lints live in each member crate (see ext/tokra/Cargo.toml), so a crate
# never depends on a workspace table for them.

# Keep the symbol table in released builds, so a crash or panic backtrace
# from an installed gem names its functions. Debug info stays off: on Linux
# it grows tokra.so from 6 MB to 29 MB (line tables only) or 94 MB (full),
# and the symbols alone already name each frame. Not stripping also keeps
# rust-objcopy out of the build: the objcopy in Rust before 1.99 stripped
# bundles in a way macOS 27's loader rejects. Profiles take effect only at
# the workspace root, so this lives here, beside the lockfile the gem ships.
[profile.release]
debug = false
strip = false
