[package]
name = "tokra"
version = "0.1.0"
edition = "2021"
authors = ["Kerrick Long <me@kerricklong.com>"]
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# rb-sys exposes AsRawValue, for comparing a thread VALUE without the GVL.
magnus = { git = "https://github.com/matsadler/magnus", rev = "2370a35261db7476f59e165752791fd60fddc26b", features = ["bytes", "rb-sys"] }
# Ruby's thread-event hooks, which magnus does not wrap (gvl_handoff.rs).
# The same rb-sys magnus links, with no features of its own.
rb-sys = { version = "0.9.124", default-features = false }
tao = "0.34.5"
# linux-body hands custom-protocol request bodies to the handler on Linux,
# as tauri-runtime-wry enables it (Cargo.toml:15-20); without it WebKitGTK
# requests arrive with empty bodies.
wry = { version = "0.54.1", features = ["linux-body"] }
ctrlc = "3.4"
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

# A window's -[NSWindow windowNumber], for its AppKit handle (raw_handle.rs,
# plan 035); -[NSWindow center], a screen's visible frame, and a webview's
# frame (window_state.rs, plan 040). tao already locks these versions with
# these features.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSScreen", "NSView", "NSWindow"] }

# A monitor's work area from GDK (window_state.rs, plan 040), as
# tauri-runtime-wry reads it. tao already locks this version.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18.2"

# A monitor's work area and a decorated window's frame bounds
# (window_state.rs, plan 040), as tauri-runtime-wry reads them. tao already
# locks this version with these features.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

# Strict linting: deny fails builds but allows targeted #[allow] for FFI
# constraints. Each crate states its lints itself instead of inheriting them
# with `workspace = true`: an installed gem ships only its own crate, with no
# workspace root to inherit from.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
# Every unsafe block and impl carries a SAFETY comment citing the source
# that makes it sound.
undocumented_unsafe_blocks = "deny"

# Unsafe code is denied by default, but targeted exceptions are allowed with
# #[allow(unsafe_code)] annotations. Each exception must be documented in
# clippy_exceptions.rb with justification.
[lints.rust]
unsafe_code = "deny"
