[package]
name = "tokra"
version = "0.1.0"
edition = "2021"
authors = ["Kerrick Long <me@kerricklong.com>"]
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# rb-sys exposes AsRawValue, for comparing a thread VALUE without the GVL.
magnus = { git = "https://github.com/matsadler/magnus", rev = "2370a35261db7476f59e165752791fd60fddc26b", features = ["bytes", "rb-sys"] }
# Ruby's thread-event hooks, which magnus does not wrap (gvl_handoff.rs).
# The same rb-sys magnus links, with no features of its own.
rb-sys = { version = "0.9.124", default-features = false }
tao = "0.34.5"
# linux-body hands custom-protocol request bodies to the handler on Linux,
# as tauri-runtime-wry enables it (Cargo.toml:15-20); without it WebKitGTK
# requests arrive with empty bodies.
wry = { version = "0.54.1", features = ["linux-body"] }
ctrlc = "3.4"
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
# Menus (plan 042): the version Tauri locks (vendor/tauri Cargo.lock), with
# its gtk feature as crates/tauri/Cargo.toml:89-92 enables it, and libxdo,
# Tauri's linux-libxdo (Cargo.toml:199), built in as an additive feature.
# common-controls-v6 stays off; plan 042, decision 2, says why.
muda = { version = "=0.17.1", default-features = false, features = ["gtk", "libxdo"] }
# Tray icons (plan 043): the version Tauri locks (vendor/tauri Cargo.lock),
# which depends on the same muda 0.17, with the features
# crates/tauri/Cargo.toml:93-95 and :199 enable but serde (Ruby owns the
# event's wire format) and common-controls-v6 (decision 2 of plan 042).
tray-icon = { version = "=0.21.0", default-features = false, features = ["libxdo"] }

# A window's -[NSWindow windowNumber], for its AppKit handle (raw_handle.rs,
# plan 035); -[NSWindow center], a screen's visible frame, and a webview's
# frame (window_state.rs, plan 040); the sheet that disables a window
# (window_ext.rs, plan 041), which needs NSGraphics, NSApplication, block2,
# and objc2-core-foundation, as tauri-runtime-wry enables them
# (Cargo.toml:50-58). tao already locks these versions; block2 is the one
# feature it does not enable.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSApplication", "NSGraphics", "NSResponder", "NSScreen", "NSView", "NSWindow"] }

# A monitor's work area from GDK (window_state.rs, plan 040), as
# tauri-runtime-wry reads it. tao already locks this version.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18.2"

# Whether an AppIndicator library loads, before tray-icon's
# libappindicator-sys panics when none does (plan 043, decision 8): the
# version libappindicator-sys 0.9.0 locks, which tray-icon uses on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7.4"

# A monitor's work area and a decorated window's frame bounds
# (window_state.rs, plan 040), as tauri-runtime-wry reads them; a window's
# enabled state and the undecorated resize handler (window_ext.rs,
# undecorated_resizing.rs, plan 041). tao already locks this version with
# these features.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Strict linting: deny fails builds but allows targeted #[allow] for FFI
# constraints. Each crate states its lints itself instead of inheriting them
# with `workspace = true`: an installed gem ships only its own crate, with no
# workspace root to inherit from.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
# Every unsafe block and impl carries a SAFETY comment citing the source
# that makes it sound.
undocumented_unsafe_blocks = "deny"

# Unsafe code is denied by default, but targeted exceptions are allowed with
# #[allow(unsafe_code)] annotations. Each exception must be documented in
# clippy_exceptions.rb with justification.
[lints.rust]
unsafe_code = "deny"
