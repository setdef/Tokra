# Lint parameters for this crate; lint levels live in Cargo.toml [lints].
# A binding hands every value it keeps to Ruby's garbage collector, so
# nothing is ever leaked into a 'static. The file sits in the crate so it
# ships in the gem and applies to this crate alone.
disallowed-methods = [
    { path = "std::boxed::Box::leak", reason = "Let Ruby's garbage collector own the value (magnus::wrap) instead of leaking it." },
    { path = "std::vec::Vec::leak", reason = "Let Ruby's garbage collector own the value instead of leaking it." },
]
