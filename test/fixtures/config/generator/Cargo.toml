# The config fixture generator (plan 054): asks Tauri's own crates what
# they make of each case under test/fixtures/config, so the answer key is
# theirs, not a reading of their source. Its own workspace, apart from the
# gem's: nothing ships it, and the gate never builds it (rake
# config:fixtures does). Cargo.lock was seeded from vendor/tauri/Cargo.lock,
# so every crate it shares with Tauri is at the version Tauri builds with.

[workspace]

[package]
name = "tokra-config-fixtures"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = "1"
serde_json = "1"
tauri-codegen = { path = "../../../../vendor/tauri/crates/tauri-codegen" }
tauri-utils = { path = "../../../../vendor/tauri/crates/tauri-utils" }
# The crate path codegen's CachedIcon is given, and the trait that turns
# one into the code it embeds, for the icon cases (tauri-codegen
# src/image.rs:22-118): the versions tauri-codegen builds with.
proc-macro2 = "1"
quote = "1"
# json5 itself, at the version tauri-utils reads JSON5 with, for the
# json5 cases (from_str into a serde_json Value, as parse.rs:377-382 calls
# it).
json5 = { version = "=0.4.1", optional = true }

[features]
# The build with JSON5 alone: the answer key for plan 054's phase 2,
# JSON5 half, where Tokra reads JSON5 and TOML waits (question 2).
config-json5 = ["tauri-codegen/config-json5", "dep:json5"]
# The build with Tauri's two optional config formats on: the answer key
# for plan 054's phase 2. Without it, only JSON is enabled.
formats = ["tauri-codegen/config-json5", "tauri-codegen/config-toml"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
