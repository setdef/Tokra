<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ipc transport</title>
  <script>
    // Runs after Tauri's injected scripts and before any invoke.
    // ipc-protocol.js looks up fetch and console.warn when it sends, so these
    // wrappers see what each ipc:// fetch answered, and the one warning the
    // client prints when it gives up on ipc:// for postMessage.
    window.observed = { warnings: [], errors: [], ipcFetches: [] };
    const originalError = console.error.bind(console);
    console.error = (...args) => {
      window.observed.errors.push(args.map(String).join(' '));
      originalError(...args);
    };
    const originalWarn = console.warn.bind(console);
    console.warn = (...args) => {
      window.observed.warnings.push(args.map(String).join(' '));
      originalWarn(...args);
    };
    const originalFetch = window.fetch.bind(window);
    window.fetch = async (input, init) => {
      const url = String(input instanceof Request ? input.url : input);
      // The last check makes ipc:// fail, so the client falls back to
      // postMessage as it does when a CSP blocks the custom protocol.
      if (window.blockIpcProtocol && url.startsWith('ipc:')) throw new TypeError('ipc:// blocked by the fixture');
      const response = await originalFetch(input, init);
      if (url.startsWith('ipc:')) {
        window.observed.ipcFetches.push({
          url, status: response.status, tauriResponse: response.headers.get('Tauri-Response'),
        });
      }
      return response;
    };
  </script>
  <script src="/harness.js"></script>
</head>
<body>
  <ol id="checks"></ol>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { check, finish } = window.fixture;

    (async () => {
      await check('invoke resolves', async () => {
        const reply = await invoke('ping', { message: 'PING' });
        const fetchRecord = window.observed.ipcFetches.find((f) => f.url === 'ipc://localhost/ping');
        return { pass: reply === 'PINGPONG', detail: { reply, fetch: fetchRecord || null } };
      });

      await check('unknown command rejects', async () => {
        try {
          return { pass: false, detail: { resolved: await invoke('no_such_command') } };
        } catch (error) {
          const fetchRecord = window.observed.ipcFetches.find((f) => f.url === 'ipc://localhost/no_such_command');
          return { pass: true, detail: { rejected: error, fetch: fetchRecord || null } };
        }
      });

      await check('transport', async () => ({
        pass: true,
        detail: {
          fallbackWarnings: window.observed.warnings.filter((w) => w.includes('IPC custom protocol failed')),
          ipcFetches: window.observed.ipcFetches.length,
        },
      }));

      // A top-level Uint8Array rides ipc:// as application/octet-stream
      // (process-ipc-message-fn.js), the command answers with
      // Response.new(bytes), and the client resolves the
      // application/octet-stream reply as an ArrayBuffer (Plan 033).
      await check('raw bytes round trip', async () => {
        const size = 1024 * 1024;
        const sent = new Uint8Array(size);
        for (let i = 0; i < size; i += 1) sent[i] = (i * 31 + 7) % 256;
        const started = performance.now();
        const reply = await invoke('reverse_bytes', sent);
        const elapsedMs = performance.now() - started;
        const received = reply instanceof ArrayBuffer ? new Uint8Array(reply) : null;
        let mismatches = received && received.length === size ? 0 : -1;
        if (mismatches === 0) {
          for (let i = 0; i < size; i += 1) if (received[i] !== sent[size - 1 - i]) mismatches += 1;
        }
        return {
          pass: mismatches === 0,
          detail: {
            type: Object.prototype.toString.call(reply), size: received && received.length, mismatches, elapsedMs,
          },
        };
      });

      // The command reads the page's options.headers beside the body. A
      // plain Array is octet-stream too, and fetch sends it as its text,
      // "1,2,255", as Tauri's own client does.
      await check('raw request headers', async () => {
        const typed = await invoke('describe_request', new Uint8Array([1, 2, 255]), { headers: { 'X-Probe': 'café' } });
        const array = await invoke('describe_request', [1, 2, 255]);
        return { pass: typed.raw === true, detail: { typed, array } };
      });

      // serde_json rejects a lone trailing surrogate escape before any
      // command runs (Plan 032). JSON.stringify writes the lone surrogate
      // as \udc00, so the real client sends exactly that. Over ipc:// the
      // invoke rejects with serde_json's message; over postMessage Tauri
      // reads the message before it checks the key, so the page gets the
      // JSON error through console.error and the key mismatch is never
      // logged.
      await check('a body serde_json rejects never reaches a command', async () => {
        let rejected = null;
        try {
          await invoke('ping', { message: '\udc00' });
        } catch (error) {
          rejected = error;
        }
        window.ipc.postMessage('{"cmd":"ping","callback":1,"error":2,'
          + '"payload":{"message":"\\udc00"},"__TAURI_INVOKE_KEY__":"post-message-probe"}');
        const deadline = Date.now() + 5000;
        while (window.observed.errors.length === 0 && Date.now() < deadline) {
          await new Promise((resolve) => setTimeout(resolve, 50));
        }
        const consoleErrors = window.observed.errors.slice();
        return { pass: typeof rejected === 'string' && consoleErrors.length > 0, detail: { rejected, consoleErrors } };
      });

      // Tauri drops the responder of a request whose invoke key does not
      // match, unanswered (webview/mod.rs:1728-1744), and wry gives its
      // responder no Drop, so the fetch stays pending. A correct invoke
      // sent afterwards still resolves.
      await check('mismatched key is never answered', async () => {
        let settled = null;
        fetch('ipc://localhost/ping', {
          method: 'POST',
          body: JSON.stringify({ message: 'PING' }),
          headers: {
            'Content-Type': 'application/json',
            'Tauri-Callback': '1',
            'Tauri-Error': '2',
            'Tauri-Invoke-Key': 'not-the-key',
          },
        }).then(
          (response) => { settled = `answered ${response.status}`; },
          (error) => { settled = `rejected ${error}`; },
        );
        await new Promise((resolve) => setTimeout(resolve, 1000));
        const reply = await invoke('ping', { message: 'PING' });
        return { pass: settled === null && reply === 'PINGPONG', detail: { settled, reply } };
      });

      // Once ipc:// fails the client sends every invoke by postMessage with
      // customProtocolIpcBlocked (ipc-protocol.js:57-79). The same typed
      // array arrives as a number array with the same headers, and a raw
      // reply comes back as a number array (ipc/protocol.rs:390-402).
      await check('postMessage fallback', async () => {
        window.blockIpcProtocol = true;
        const described = await invoke('describe_request', new Uint8Array([1, 2, 255]), { headers: { 'X-Probe': 'café' } });
        const reversed = await invoke('reverse_bytes', new Uint8Array([1, 2, 3]));
        const fellBack = window.observed.warnings.some((w) => w.includes('IPC custom protocol failed'));
        return { pass: fellBack, detail: { described, reversed } };
      });

      await finish();
    })();
  </script>
</body>
</html>
