# The gate contributors run, bundle exec rake, on each operating system tao
# and wry support, for every Ruby release Tokra supports (Plan 019). The
# gate covers tokra and every plugin, so every change runs all of it.

name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.os }}, Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Each supported Ruby release, one per line (tokra.gemspec requires
        # 4.0.1 or newer; setup-ruby picks the latest 4.0 patch). Add a
        # release when it ships, and remove one only at its end of life.
        ruby:
          - "4.0"
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows writes symlinks as plain files by default, and
      # CLAUDE.md and .claude/skills/ are symlinks the REUSE check reads.
      # Line endings stay converted, as on a contributor's machine.
      - name: Check out symlinks as symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      # sync:tauri extracts the JavaScript templates from the vendor/tauri
      # submodule, so the checkout needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # mise.toml pins the toolchains contributors use; CI reads the same
      # pins rather than repeating them. RubyInstaller's Ruby is a MinGW
      # build, and rb-sys refuses to build it with Rust's MSVC target
      # (rb-sys-build rb_config.rs, validate_target_compatibility), so
      # Windows takes the GNU host toolchain.
      - name: Read the toolchain pins
        id: pins
        run: |
          rust=$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)
          python=$(sed -n 's/^python = "\(.*\)"$/\1/p' mise.toml)
          if [ "$RUNNER_OS" = Windows ]; then rust="$rust-x86_64-pc-windows-gnu"; fi
          {
            echo "rust=$rust"
            echo "python=$python"
            # tokra is the one native gem in this repository, its own Cargo
            # workspace (plugins build on Ferro's gems, ADR 011).
            echo "workspaces=. -> target"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          components: clippy, rustfmt

      # The extensions link Ruby's headers through bindgen, so the compiled
      # dependencies differ by Ruby release as well as by OS.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ruby-${{ matrix.ruby }}
          workspaces: ${{ steps.pins.outputs.workspaces }}

      # The REUSE tool checks licensing, for the repository and for each
      # unpacked gem. It needs a module that detects file encodings: its
      # python-magic needs libmagic, which only the Linux image has, so
      # charset-normalizer, pure Python, serves every OS.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      # The maintainer's version, so CI and contributors read the same rules.
      - name: Install the REUSE tool
        run: python -m pip install "reuse[charset-normalizer]==6.2.0"

      # tao and wry link GTK 3 and WebKitGTK 4.1 (wry's and tao's READMEs),
      # through the -sys crates Cargo.lock pins: webkit2gtk-sys, soup3-sys,
      # javascriptcore-rs-sys, gtk-sys, and gdkx11-sys. libX11 needs no
      # headers: the x11 crate is used for its types only, and x11-dl loads
      # the library at run time. bindgen needs libclang, for tokra and for
      # ferro-arboard, which bundle install compiles, so this comes first.
      # Xvfb and D-Bus give the real-window tests a display and a session
      # bus. arboard speaks X11 through a pure-Rust client and needs no
      # library. There is no clipboard manager: arboard offers one the
      # contents only when the last clipboard drops, within 100 ms
      # (arboard 3.7.0 src/platform/linux/x11.rs:788-801), so no test relies
      # on it, and xfce4-clipman refills a clipboard a test has just cleared
      # (Ferro's plan 001; Plan 021). ferro-rfd, which bundle install compiles
      # for tokra-dialog, links libwayland-client through rfd's wayland
      # feature, found with pkg-config (its README); its tests stand in a fake
      # zenity for the dialogs (Plan 023). tokra-notification's tests start
      # dbus-daemon and dunst on a session bus of their own and read the
      # Notify calls with dbus-monitor, from the dbus package; notify-rust
      # speaks D-Bus through zbus, pure Rust, so building ferro-notify-rust
      # needs nothing more (Plan 024).
      - name: Install GTK, WebKitGTK, and a display server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            pkg-config libclang-dev libwayland-dev xvfb xauth dbus dbus-x11 dunst

      # Ruby without the bundle: on Windows, bindgen's settings come from
      # what setup-ruby exports, and bundle install already needs them to
      # compile ferro-arboard from its git source. setup-ruby runs once: a
      # second run on Windows fails linking MSYS2's tree beside Ruby again
      # (windows.js:133-136, fs.symlinkSync onto the junction the first run
      # made), so the bundle is installed and cached by the steps below.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}

      # bindgen parses Ruby's MinGW headers, so clang must target MinGW and
      # find the MSYS2 tree setup-ruby installs beside Ruby. setup-ruby
      # exports what RubyInstaller's ridk enable sets (windows.js:138-140):
      # the tree as RI_DEVKIT and its prefix as MSYSTEM_PREFIX, /ucrt64 for
      # Ruby 4.0. RbConfig's host_os does not say ucrt. This follows
      # oxidize-rb/actions' setup-ruby-and-rust, including its two AVX-512
      # defines, which keep clang from parsing intrinsics headers bindgen
      # cannot handle (rust-bindgen #2500). libclang comes from the LLVM the
      # runner image ships.
      - name: Point bindgen at Ruby's MSYS2 headers
        if: runner.os == 'Windows'
        run: |
          sysroot="${RI_DEVKIT//\\//}${MSYSTEM_PREFIX:?setup-ruby did not set MSYSTEM_PREFIX}"
          libclang="C:/Program Files/LLVM/bin"
          test -f "$sysroot/include/stdio.h" || { echo "::error::no C headers (stdio.h) in $sysroot/include"; exit 1; }
          test -f "$libclang/libclang.dll" || { echo "::error::no libclang.dll in $libclang"; exit 1; }
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-gnu --sysroot=$sysroot -D__AVX512VLFP16INTRIN_H -D__AVX512FP16INTRIN_H" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"

      # The bundle, as setup-ruby's bundler-cache would install it: frozen
      # to Gemfile.lock, in vendor/bundle, cached by OS, CPU, exact Ruby,
      # and lockfile.
      - name: Read the exact Ruby
        id: exact
        run: echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-${{ runner.arch }}-${{ steps.exact.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}
      - name: Install the bundle
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local frozen true
          bundle install --jobs 4

      # RealApp runs a real window only in an Aqua session (launchctl
      # managername); this records which session the runner has.
      - name: Report the GUI session
        if: runner.os == 'macOS'
        run: echo "launchctl managername is $(launchctl managername)"

      # The real-window tests open tao windows with WebKitGTK webviews on
      # Xvfb, and the clipboard tests use the same display.
      - name: Run the gate under X11
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum dbus-run-session -- bundle exec rake

      - name: Run the gate
        if: runner.os != 'Linux'
        run: bundle exec rake
